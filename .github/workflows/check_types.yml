---
name: Type Check

on:
  push:
    branches:
      - main
      - test

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra type --extra test

      - name: Check types with ty
        run: .venv/bin/ty check
